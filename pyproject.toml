[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "page-cite-rag"
version = "0.1.0"
description = "Local-first bilingual document reading with source-grounded answers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencc>=1.4.2,<2",
    "bm25s>=0.2,<0.3",
    "httpx>=0.28,<0.29",
    "jieba==0.42.1",
    "numpy>=2,<3",
    "pdfplumber>=0.11.10,<0.12",
    "pydantic>=2.7,<3",
]

[project.scripts]
page-cite-rag = "page_cite_rag.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]
gpu-embed = [
    "tokenizers>=0.22,<0.24",
]
parser = [
    "docling==2.137.0",
    "docling-core==2.101.1",
    "transformers==5.19.0",
]
agent = [
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
]
ml-cpu = [
    "sentence-transformers>=6.1,<7",
    "transformers>=5.18,<6",
    "torch>=2.14.1,<3",
    "torchvision==0.29.1",
    "safetensors>=0.8,<1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "ml-cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "ml-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]
eval = [
    "pyarrow>=21,<25",
    "scikit-learn>=1.9,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/page_cite_rag"]

[tool.hatch.build.targets.sdist]
only-include = [
    "README.md",
    "pyproject.toml",
    "src/page_cite_rag",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
