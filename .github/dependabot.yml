version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "01:27"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    allow:
      - dependency-type: all
    groups:
      document-parser:
        patterns:
          - docling
          - docling-*
          - pillow
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
